name: Native update E2E

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/test-native-update-e2e.yml'
      - '.github/workflows/auto_update.yaml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/test-native-update-e2e.yml'
      - '.github/workflows/auto_update.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-update:
    name: Native update (${{ matrix.platform }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: windows-x86_64, runner: windows-2025 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install test dependencies
        run: python -m pip install -r scripts/update_e2e/requirements.txt
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Test native update lifecycle
        run: python scripts/update_e2e/run.py --output update-e2e
      - name: Upload native update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-update-${{ matrix.platform }}
          path: update-e2e/reports/
          if-no-files-found: warn
          retention-days: 14
