name: Auto Update Workflow

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (windows/macos)"
        required: true
        type: choice
        options:
          - all platforms
          - macos
          - windows
          - linux
      updaterGeneration:
        description: "Updater feeds to generate"
        required: true
        type: choice
        default: both
        options:
          - both
          - legacy
          - native
      criticalUpdate:
        description: "Whether to create a critical update"
        required: false
        type: boolean
        default: false
      appflowyVersion:
        description: "AppFlowy Release version (leave empty for latest)"
        required: false
        type: string
      releaseVersionNumber:
        description: "Release version number (leave empty for latest)"
        required: false
        type: string
      repoOwner:
        description: "Repository owner (leave empty for AppFlowy)"
        required: false
        type: string
        default: "AppFlowy-IO"
      repoName:
        description: "Repository name (leave empty for AppFlowy)"
        required: false
        type: string
        default: "AppFlowy"

env:
  GH_TOKEN: ${{ secrets.BUILDER_GITHUB_TOKEN }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - id: release
        env:
          REQUESTED_TAG: ${{ inputs.appflowyVersion }}
          REPOSITORY: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then TAG=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name); fi
          [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
  native:
    needs: resolve
    if: inputs.platform != 'linux'
    name: ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos, arch: arm64, package_arch: universal, runner: macos-latest }
          - { os: macos, arch: x86_64, package_arch: x86_64, runner: macos-latest }
          - { os: windows, arch: x86_64, package_arch: x86_64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: inputs.platform == 'all platforms' || inputs.platform == matrix.os
        with:
          python-version: "3.11"
      - name: Install update verification dependencies
        if: inputs.platform == 'all platforms' || inputs.platform == matrix.os
        run: python -m pip install -r scripts/requirements-update-validation.txt
      - name: Resolve exact published release
        if: inputs.platform == 'all platforms' || inputs.platform == matrix.os
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
          REQUESTED_TAG: ${{ needs.resolve.outputs.tag }}
          ADVERTISED_VERSION: ${{ inputs.releaseVersionNumber }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then TAG=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name); fi
          gh api "repos/$REPOSITORY/releases/tags/$TAG" > release.json
          python3 - "$TAG" <<'PYCODE'
          import json, os, re, sys
          release = json.load(open('release.json', encoding='utf-8'))
          tag = sys.argv[1]
          version = tag.removeprefix('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Stable release required'
          assert not release['draft'] and not release['prerelease'], 'Published stable release required'
          override = os.environ['ADVERTISED_VERSION'].removeprefix('v')
          assert not override or override == version, 'Feed must advertise the actual installer version'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TAG={tag}\nVERSION={version}\nREPOSITORY={os.environ["REPOSITORY"]}\n')
          PYCODE
      - name: Download final installer
        if: inputs.platform == 'all platforms' || inputs.platform == matrix.os
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          set -euo pipefail
          EXT=exe; if [ "$OS" = macos ]; then EXT=dmg; fi
          ASSET="AppFlowy-$VERSION-$OS-$PACKAGE_ARCH.$EXT"
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "$ASSET" --output "app.$EXT"
          python3 scripts/verify_native_update.py release-asset \
            --release-json release.json --asset-name "$ASSET" --installer "app.$EXT"
      - name: Sign macOS installer and read its actual build version
        if: matrix.os == 'macos' && (inputs.platform == 'all platforms' || inputs.platform == 'macos')
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.MACOS_AUTO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz -o sparkle.tar.xz
          echo '5cddb7695674ef7704268f38eccaee80e3accbf19e61c1689efff5b6116d85be  sparkle.tar.xz' | shasum -a 256 -c -
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          mkdir mount
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$PWD/mount" app.dmg
          trap 'hdiutil detach "$PWD/mount"' EXIT
          apps=(mount/*.app)
          test "${#apps[@]}" -eq 1
          BUILD_VERSION=$(python3 scripts/verify_native_update.py macos-bundle \
            --bundle "${apps[0]}" --version "$VERSION")
          codesign --verify --strict --deep "${apps[0]}"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          printf '%s' "$UPDATE_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - -p app.dmg > signature.txt
          python3 scripts/verify_native_update.py signature \
            --platform macos --installer app.dmg --signature-file signature.txt
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
      - name: Verify Windows Authenticode signature
        if: matrix.os == 'windows' && (inputs.platform == 'all platforms' || inputs.platform == 'windows')
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath app.exe
          if ($signature.Status -ne 'Valid') {
            throw "Published Windows installer has an invalid Authenticode signature: $($signature.Status)"
          }
          Write-Host "Verified installer signer: $($signature.SignerCertificate.Subject)"
          $version = (Get-Item -LiteralPath app.exe).VersionInfo.ProductVersion.Trim()
          if ($version -ne $env:VERSION) {
            throw "Windows installer version $version does not match release $env:VERSION"
          }
      - name: Sign Windows installer
        if: matrix.os == 'windows' && (inputs.platform == 'all platforms' || inputs.platform == 'windows')
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.WINDOWS_AUTO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_PRIVATE_KEY"
          umask 077
          trap 'rm -f update-key.pem signature.bin' EXIT
          printf '%s' "$UPDATE_PRIVATE_KEY" > update-key.pem
          openssl dgst -sha1 -sign update-key.pem -out signature.bin app.exe
          openssl base64 -A -in signature.bin > signature.txt
          python3 scripts/verify_native_update.py signature \
            --platform windows --installer app.exe --signature-file signature.txt
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Read release compatibility manifest
        if: inputs.platform == 'all platforms' || inputs.platform == matrix.os
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import json,sys; sys.exit(not any(a["name"] == "desktop-update.json" for a in json.load(open("release.json", encoding="utf-8"))["assets"]))'; then
            gh release download "$TAG" --repo "$REPOSITORY" --pattern desktop-update.json --output desktop-update.json
            python3 - <<'PYCODE'
          import json, os, re
          metadata = json.load(open('desktop-update.json', encoding='utf-8'))
          assert metadata['version'].removeprefix('v') == os.environ['VERSION']
          floor = metadata['minimum_server_version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', floor)
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write(f'MINIMUM_SERVER_VERSION={floor}\n')
          PYCODE
          fi
      - name: Generate legacy and native appcasts
        if: inputs.platform == 'all platforms' || inputs.platform == matrix.os
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          CRITICAL: ${{ inputs.criticalUpdate }}
          UPDATER_GENERATION: ${{ inputs.updaterGeneration || 'both' }}
        run: |
          set -euo pipefail
          EXT=exe; if [ "$OS" = macos ]; then EXT=dmg; fi
          EXTRA=()
          if [ "$CRITICAL" = true ]; then EXTRA+=(--critical); fi
          if [ -n "${MINIMUM_SERVER_VERSION:-}" ]; then EXTRA+=(--minimum-server-version "$MINIMUM_SERVER_VERSION"); fi
          python3 scripts/generate_native_appcast.py "${EXTRA[@]}" --tag "$TAG" --platform "$OS" --arch "$ARCH" --package-arch "$PACKAGE_ARCH" --installer "app.$EXT" --signature-file signature.txt --build-version "$BUILD_VERSION" --repository "$REPOSITORY" --generation "$UPDATER_GENERATION" --output-dir feeds
      - uses: actions/upload-artifact@v4
        if: (inputs.platform == 'all platforms' || inputs.platform == matrix.os) && inputs.updaterGeneration != 'native'
        with:
          name: appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          path: feeds/appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: (inputs.platform == 'all platforms' || inputs.platform == matrix.os) && inputs.updaterGeneration != 'legacy'
        with:
          name: native-appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          path: feeds/native-appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          if-no-files-found: error
          compression-level: 0

  linux-x86_64:
    needs: resolve
    runs-on: ubuntu-latest

    if: ${{ (inputs.platform == 'all platforms' || inputs.platform == 'linux') && inputs.updaterGeneration != 'native' }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.repoOwner }}/${{ github.event.inputs.repoName }}
          ref: main

      - name: Get latest release if version not specified
        if: false
        id: latest_release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getLatestRelease({
              owner: '${{ github.event.inputs.repoOwner }}',
              repo: '${{ github.event.inputs.repoName }}'
            });
            core.setOutput('version', release.data.tag_name);

      - name: Get specific release if version specified
        if: success()
        id: specific_release
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: '${{ github.event.inputs.repoOwner }}',
              repo: '${{ github.event.inputs.repoName }}',
              tag: '${{ needs.resolve.outputs.tag }}'
            });
            core.setOutput('version', release.data.tag_name);

      - name: Generate Appcast.xml
        working-directory: frontend/appflowy_flutter
        run: |
          VERSION=${{ steps.latest_release.outputs.version || steps.specific_release.outputs.version }}
          if [ "${{ github.event.inputs.releaseVersionNumber }}" != "" ]; then
            RELEASE_VERSION_NUMBER=${{ github.event.inputs.releaseVersionNumber }}
          else
            RELEASE_VERSION_NUMBER=$VERSION
          fi

          echo "VERSION: $VERSION"

          APPCAST_FILE_NAME="appcast-linux-x86_64.xml"

          # Create appcast.xml
          echo '<?xml version="1.0" encoding="UTF-8"?>' > $APPCAST_FILE_NAME
          echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' >> $APPCAST_FILE_NAME
          echo '    <channel>' >> $APPCAST_FILE_NAME
          echo '        <title>AppFlowy</title>' >> $APPCAST_FILE_NAME
          echo '        <description>Most recent updates to AppFlowy</description>' >> $APPCAST_FILE_NAME
          echo '        <language>en</language>' >> $APPCAST_FILE_NAME
          echo '        <item>' >> $APPCAST_FILE_NAME
          echo "            <title>Version $RELEASE_VERSION_NUMBER</title>" >> $APPCAST_FILE_NAME
          echo "            <sparkle:version>2</sparkle:version>" >> $APPCAST_FILE_NAME
          echo "            <sparkle:shortVersionString>$RELEASE_VERSION_NUMBER</sparkle:shortVersionString>" >> $APPCAST_FILE_NAME
          if [ "${{ github.event.inputs.criticalUpdate }}" = "true" ]; then
              echo "            <sparkle:criticalUpdate>true</sparkle:criticalUpdate>" >> $APPCAST_FILE_NAME
          fi
          echo "            <pubDate>$(date -R)</pubDate>" >> $APPCAST_FILE_NAME
          echo "            <enclosure" >> $APPCAST_FILE_NAME
          echo "                sparkle:os=\"linux\"" >> $APPCAST_FILE_NAME
          echo "                type=\"application/octet-stream\"" >> $APPCAST_FILE_NAME
          echo "                />" >> $APPCAST_FILE_NAME
          echo '        </item>' >> $APPCAST_FILE_NAME
          echo '    </channel>' >> $APPCAST_FILE_NAME
          echo '</rss>' >> $APPCAST_FILE_NAME

          echo "Generated $APPCAST_FILE_NAME:"
          cat $APPCAST_FILE_NAME

      - name: Upload Appcast files
        uses: actions/upload-artifact@v4
        with:
          name: appcast-linux-x86_64.xml
          path: |
            frontend/appflowy_flutter/appcast-linux-x86_64.xml
          if-no-files-found: error
          compression-level: 0

  update-release-version:
    runs-on: ubuntu-latest
    needs: [resolve, native, linux-x86_64]
    if: >-
      always() && needs.resolve.result == 'success' &&
      (needs.native.result == 'success' || needs.native.result == 'skipped') &&
      (needs.linux-x86_64.result == 'success' || needs.linux-x86_64.result == 'skipped') &&
      (needs.native.result == 'success' || needs.linux-x86_64.result == 'success')

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUILDER_GITHUB_TOKEN }}

      - name: Get version from workflow input
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            let version = '${{ needs.resolve.outputs.tag }}';

            // If no version was specified, get the latest release
            if (!version) {
              const release = await github.rest.repos.getLatestRelease({
                owner: '${{ github.event.inputs.repoOwner }}',
                repo: '${{ github.event.inputs.repoName }}'
              });
              version = release.data.tag_name;
            }

            core.setOutput('version', version);
            console.log(`Version to update: ${version}`);

      - name: Update release.yml with new version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Updating release.yml with version: $VERSION"

          # Update run-name default version (line 2)
          sed -i "s/github.event.inputs.version || '[^']*'/github.event.inputs.version || '$VERSION'/" .github/workflows/release.yml

          # Update version input default (line 15)
          sed -i "/description: \"Release version/,/default:/ s/default: \"[^\"]*\"/default: \"$VERSION\"/" .github/workflows/release.yml

          # Update scheduled build VERSION (line 103)
          sed -i "s/VERSION=\"[0-9][0-9.]*\"/VERSION=\"$VERSION\"/" .github/workflows/release.yml

          echo "Updated release.yml"
          echo "Showing changes:"
          git diff .github/workflows/release.yml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update version to ${{ steps.get_version.outputs.version }}"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push succeeded on attempt $i"
                exit 0
              fi
              echo "⚠️ Push failed on attempt $i, rebasing on latest main and retrying..."
              git pull --rebase origin main
              sleep $((i * 3))
            done
            echo "❌ Push failed after 5 attempts"
            exit 1
          fi
