name: Auto Update Workflow
run-name: ${{ inputs.testOnly && 'Stage feeds' || inputs.verifyPublishedOnly && 'Verify live upgrade' || 'Roll out and verify upgrade' }} · ${{ inputs.appflowyVersion || 'latest' }} · ${{ inputs.platform }} · ${{ inputs.updaterGeneration || 'both' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (macOS and Windows support native upgrades)"
        required: true
        type: choice
        options:
          - all platforms
          - macos
          - windows
          - linux
      updaterGeneration:
        description: "Updater feeds to generate"
        required: true
        type: choice
        default: both
        options:
          - both
          - legacy
          - native
      criticalUpdate:
        description: "Whether to create a critical update"
        required: false
        type: boolean
        default: false
      appflowyVersion:
        description: "AppFlowy Release version (leave empty for latest)"
        required: false
        type: string
      releaseVersionNumber:
        description: "Release version number (leave empty for latest)"
        required: false
        type: string
      testOnly:
        description: "Stage and test feeds only (allows drafts, no release writes)"
        required: false
        type: boolean
        default: false
      verifyPublishedOnly:
        description: "Replay public discovery and the released-client upgrade without changing the release"
        required: false
        type: boolean
        default: false
      repoOwner:
        description: "Repository owner (leave empty for AppFlowy)"
        required: false
        type: string
        default: "AppFlowy-IO"
      repoName:
        description: "Repository name (leave empty for AppFlowy)"
        required: false
        type: string
        default: "AppFlowy"

permissions:
  contents: read

env:
  DELIVERY_MODE: ${{ inputs.testOnly && 'stage' || inputs.verifyPublishedOnly && 'verify' || 'publish' }}
  GH_TOKEN: ${{ secrets.BUILDER_GITHUB_TOKEN }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.release_id }}
      source: ${{ steps.release.outputs.source }}
      matrix: ${{ steps.release.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: release
        env:
          REQUESTED_TAG: ${{ inputs.appflowyVersion }}
          ADVERTISED_VERSION: ${{ inputs.releaseVersionNumber }}
          REPOSITORY: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
          PLATFORM: ${{ inputs.platform }}
          GENERATION: ${{ inputs.updaterGeneration || 'both' }}
          CONFLICTING_MODES: ${{ inputs.testOnly && inputs.verifyPublishedOnly }}
        run: |
          if [ "$CONFLICTING_MODES" = true ]; then echo 'Choose either staging or read-only verification'; exit 1; fi
          python3 scripts/desktop_update_delivery.py resolve --mode "$DELIVERY_MODE" --repository "$REPOSITORY" \
            --tag "$REQUESTED_TAG" --version "$ADVERTISED_VERSION" --platform "$PLATFORM" --generation "$GENERATION"
  native:
    needs: resolve
    if: inputs.platform != 'linux' && !inputs.verifyPublishedOnly
    name: ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install update verification dependencies
        run: python -m pip install -r scripts/update_e2e/requirements.txt
      - name: Set up MSVC for native update host
        if: matrix.os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Resolve exact published release
        shell: bash
        env:
          REPOSITORY: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
          REQUESTED_TAG: ${{ needs.resolve.outputs.tag }}
          ADVERTISED_VERSION: ${{ inputs.releaseVersionNumber }}
          TEST_ONLY: ${{ inputs.testOnly }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then TAG=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name); fi
          gh api "repos/$REPOSITORY/releases/tags/$TAG" > release.json
          python3 - "$TAG" <<'PYCODE'
          import json, os, re, sys
          release = json.load(open('release.json', encoding='utf-8'))
          tag = sys.argv[1]
          version = tag.removeprefix('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Stable release required'
          assert not release['prerelease'], 'Stable release required'
          assert not release['draft'] or os.environ['TEST_ONLY'] == 'true', 'Draft releases require testOnly'
          override = os.environ['ADVERTISED_VERSION'].removeprefix('v')
          assert not override or override == version, 'Feed must advertise the actual installer version'
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'TAG={tag}\nVERSION={version}\nREPOSITORY={os.environ["REPOSITORY"]}\n')
          PYCODE
      - name: Download final installer
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
        run: |
          set -euo pipefail
          EXT=exe; if [ "$OS" = macos ]; then EXT=dmg; fi
          ASSET="AppFlowy-$VERSION-$OS-$PACKAGE_ARCH.$EXT"
          gh release download "$TAG" --repo "$REPOSITORY" --pattern "$ASSET" --output "app.$EXT"
          python3 scripts/verify_native_update.py release-asset \
            --release-json release.json --asset-name "$ASSET" --installer "app.$EXT"
      - name: Sign macOS installer and read its actual build version
        if: matrix.os == 'macos'
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.MACOS_AUTO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          curl --fail --location https://github.com/sparkle-project/Sparkle/releases/download/2.8.1/Sparkle-2.8.1.tar.xz -o sparkle.tar.xz
          echo '5cddb7695674ef7704268f38eccaee80e3accbf19e61c1689efff5b6116d85be  sparkle.tar.xz' | shasum -a 256 -c -
          mkdir sparkle && tar -xf sparkle.tar.xz -C sparkle
          mkdir mount
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$PWD/mount" app.dmg
          trap 'hdiutil detach "$PWD/mount"' EXIT
          apps=(mount/*.app)
          test "${#apps[@]}" -eq 1
          BUILD_VERSION=$(python3 scripts/verify_native_update.py macos-bundle \
            --bundle "${apps[0]}" --version "$VERSION")
          codesign --verify --strict --deep "${apps[0]}"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          printf '%s' "$UPDATE_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - -p app.dmg > signature.txt
          python3 scripts/verify_native_update.py signature \
            --platform macos --installer app.dmg --signature-file signature.txt
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
      - name: Verify Windows Authenticode signature
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath app.exe
          if ($signature.Status -ne 'Valid') {
            throw "Published Windows installer has an invalid Authenticode signature: $($signature.Status)"
          }
          Write-Host "Verified installer signer: $($signature.SignerCertificate.Subject)"
          $version = (Get-Item -LiteralPath app.exe).VersionInfo.ProductVersion.Trim()
          if ($version -ne $env:VERSION) {
            throw "Windows installer version $version does not match release $env:VERSION"
          }
      - name: Sign Windows installer
        if: matrix.os == 'windows'
        shell: bash
        env:
          UPDATE_PRIVATE_KEY: ${{ secrets.WINDOWS_AUTO_UPDATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_PRIVATE_KEY"
          umask 077
          trap 'rm -f update-key.pem signature.bin' EXIT
          printf '%s' "$UPDATE_PRIVATE_KEY" > update-key.pem
          # WinSparkle's legacy protocol signs SHA1(installer) using DSA/SHA1:
          # https://github.com/vslavik/winsparkle/blob/v0.9.4/bin/legacy_sign_update.bat
          openssl dgst -sha1 -binary app.exe | openssl dgst -sha1 -sign update-key.pem -out signature.bin
          openssl base64 -A -in signature.bin > signature.txt
          python3 scripts/verify_native_update.py signature \
            --platform windows --installer app.exe --signature-file signature.txt
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Read release compatibility manifest
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import json,sys; sys.exit(not any(a["name"] == "desktop-update.json" for a in json.load(open("release.json", encoding="utf-8"))["assets"]))'; then
            gh release download "$TAG" --repo "$REPOSITORY" --pattern desktop-update.json --output desktop-update.json
            python3 - <<'PYCODE'
          import json, os, re
          metadata = json.load(open('desktop-update.json', encoding='utf-8'))
          assert metadata['version'].removeprefix('v') == os.environ['VERSION']
          floor = metadata['minimum_server_version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', floor)
          with open(os.environ['GITHUB_ENV'], 'a') as output: output.write(f'MINIMUM_SERVER_VERSION={floor}\n')
          PYCODE
          fi
      - name: Generate legacy and native appcasts
        shell: bash
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          PACKAGE_ARCH: ${{ matrix.package_arch }}
          CRITICAL: ${{ inputs.criticalUpdate }}
          UPDATER_GENERATION: ${{ inputs.updaterGeneration || 'both' }}
        run: |
          set -euo pipefail
          EXT=exe; if [ "$OS" = macos ]; then EXT=dmg; fi
          # Bash 3.2 treats an empty array as unset under nounset. Start with the
          # required arguments so ordinary releases need no optional metadata.
          ARGS=(--tag "$TAG" --platform "$OS" --arch "$ARCH" --package-arch "$PACKAGE_ARCH"
            --installer "app.$EXT" --signature-file signature.txt --build-version "$BUILD_VERSION"
            --repository "$REPOSITORY" --generation "$UPDATER_GENERATION" --output-dir feeds)
          if [ "$CRITICAL" = true ]; then ARGS+=(--critical); fi
          if [ -n "${MINIMUM_SERVER_VERSION:-}" ]; then ARGS+=(--minimum-server-version "$MINIMUM_SERVER_VERSION"); fi
          python3 scripts/generate_native_appcast.py "${ARGS[@]}"
      - name: Test signed installer through the native updater
        shell: bash
        env:
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          EXT=exe; if [ "$OS" = macos ]; then EXT=dmg; fi
          FEEDS=(feeds/*appcast-*.xml)
          python scripts/update_e2e/run.py --output update-e2e --appcast "${FEEDS[0]}" \
            --installer "app.$EXT" --signature-file signature.txt \
            --version "$VERSION" --build-version "$BUILD_VERSION"
      - name: Test signed installer through the legacy Windows updater
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          FEEDS=(feeds/*appcast-*.xml)
          python scripts/update_e2e/run.py --output update-e2e-legacy --winsparkle-version 0.8.1 --appcast "${FEEDS[0]}" \
            --installer app.exe --signature-file signature.txt \
            --version "$VERSION" --build-version "$BUILD_VERSION"
      - name: Upload native update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-update-e2e-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            update-e2e/reports/
            update-e2e-legacy/reports/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: inputs.updaterGeneration != 'native'
        with:
          name: appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          path: feeds/appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          if-no-files-found: error
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: inputs.updaterGeneration != 'legacy'
        with:
          name: native-appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          path: feeds/native-appcast-${{ matrix.os }}-${{ matrix.arch }}.xml
          if-no-files-found: error
          compression-level: 0

  linux-x86_64:
    needs: resolve
    runs-on: ubuntu-latest

    if: ${{ (inputs.platform == 'all platforms' || inputs.platform == 'linux') && inputs.updaterGeneration != 'native' && !inputs.verifyPublishedOnly }}

    steps:
      - name: Generate Appcast.xml
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
          CRITICAL: ${{ inputs.criticalUpdate }}
        run: |
          set -euo pipefail
          RELEASE_VERSION_NUMBER=${TAG#v}
          APPCAST_FILE_NAME="appcast-linux-x86_64.xml"

          # Create appcast.xml
          echo '<?xml version="1.0" encoding="UTF-8"?>' > $APPCAST_FILE_NAME
          echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">' >> $APPCAST_FILE_NAME
          echo '    <channel>' >> $APPCAST_FILE_NAME
          echo '        <title>AppFlowy</title>' >> $APPCAST_FILE_NAME
          echo '        <description>Most recent updates to AppFlowy</description>' >> $APPCAST_FILE_NAME
          echo '        <language>en</language>' >> $APPCAST_FILE_NAME
          echo '        <item>' >> $APPCAST_FILE_NAME
          echo "            <title>Version $RELEASE_VERSION_NUMBER</title>" >> $APPCAST_FILE_NAME
          echo "            <sparkle:version>2</sparkle:version>" >> $APPCAST_FILE_NAME
          echo "            <sparkle:shortVersionString>$RELEASE_VERSION_NUMBER</sparkle:shortVersionString>" >> $APPCAST_FILE_NAME
          if [ "$CRITICAL" = "true" ]; then
              echo "            <sparkle:criticalUpdate>true</sparkle:criticalUpdate>" >> $APPCAST_FILE_NAME
          fi
          echo "            <pubDate>$(date -R)</pubDate>" >> $APPCAST_FILE_NAME
          echo "            <enclosure" >> $APPCAST_FILE_NAME
          echo "                sparkle:os=\"linux\"" >> $APPCAST_FILE_NAME
          echo "                type=\"application/octet-stream\"" >> $APPCAST_FILE_NAME
          echo "                />" >> $APPCAST_FILE_NAME
          echo '        </item>' >> $APPCAST_FILE_NAME
          echo '    </channel>' >> $APPCAST_FILE_NAME
          echo '</rss>' >> $APPCAST_FILE_NAME

          echo "Generated $APPCAST_FILE_NAME:"
          cat $APPCAST_FILE_NAME

      - name: Upload Appcast files
        uses: actions/upload-artifact@v4
        with:
          name: appcast-linux-x86_64.xml
          path: appcast-linux-x86_64.xml
          if-no-files-found: error
          compression-level: 0

  delivery:
    name: ${{ inputs.testOnly && 'Validate staged feeds' || 'Verify public feeds and client discovery' }}
    needs: [resolve, native, linux-x86_64]
    if: >-
      always() && !cancelled() && needs.resolve.result == 'success' &&
      (inputs.verifyPublishedOnly ||
      ((inputs.platform == 'linux' || needs.native.result == 'success') &&
      ((inputs.platform != 'linux' && inputs.platform != 'all platforms') ||
      inputs.updaterGeneration == 'native' || needs.linux-x86_64.result == 'success')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: desktop-update-delivery-${{ inputs.repoOwner }}-${{ inputs.repoName }}-${{ needs.resolve.outputs.tag }}-${{ (inputs.testOnly || inputs.verifyPublishedOnly) && github.run_id || 'publish' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.verifyPublishedOnly }}
        with:
          pattern: '*appcast-*.xml'
          merge-multiple: true
          path: feeds
      - name: Validate selected feed set and delivery
        env:
          REPOSITORY: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
          TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          SOURCE: ${{ needs.resolve.outputs.source }}
          PLATFORM: ${{ inputs.platform }}
          GENERATION: ${{ inputs.updaterGeneration || 'both' }}
        run: |
          python3 scripts/desktop_update_delivery.py deliver --mode "$DELIVERY_MODE" --repository "$REPOSITORY" \
            --tag "$TAG" --release-id "$RELEASE_ID" --source "$SOURCE" --platform "$PLATFORM" --generation "$GENERATION"

  installed-upgrade:
    name: Installed ${{ needs.resolve.outputs.source }} → ${{ needs.resolve.outputs.tag }} (${{ matrix.os }} ${{ matrix.arch }})
    needs: [resolve, delivery]
    if: >-
      always() && !cancelled() && needs.delivery.result == 'success' &&
      !inputs.testOnly && needs.resolve.outputs.source != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_TAG: ${{ needs.resolve.outputs.source }}
      TARGET_TAG: ${{ needs.resolve.outputs.tag }}
      REPOSITORY: ${{ inputs.repoOwner }}/${{ inputs.repoName }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and install the previous public release
        run: python scripts/update_e2e/install_previous.py
      - name: Use the Update button and verify the new app
        if: runner.os == 'macOS'
        working-directory: scripts/update_e2e/macos_ui
        shell: bash
        run: |
          set -euo pipefail
          gem list -i xcodeproj -v 1.27.0 || gem install --user-install --no-document xcodeproj -v 1.27.0
          ruby project.rb
          TEST_RUNNER_RELEASED_APP_PATH="$APP_PATH" TEST_RUNNER_SOURCE_VERSION="${SOURCE_TAG#v}" \
            TEST_RUNNER_TARGET_VERSION="${TARGET_TAG#v}" \
            xcodebuild test -project UpgradeValidation.xcodeproj -scheme ReleasedUpgradeUITests \
            -destination "platform=macOS,arch=$(uname -m)" -parallel-testing-enabled NO \
            -resultBundlePath "$GITHUB_WORKSPACE/evidence/upgrade.xcresult"
          python "$GITHUB_WORKSPACE/scripts/verify_native_update.py" macos-bundle --bundle "$APP_PATH" --version "${TARGET_TAG#v}"
          codesign --verify --strict --deep "$APP_PATH"
      - name: Use the Update button and verify the new app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/update_e2e/windows_ui.ps1
      - name: Upload installed upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installed-upgrade-${{ matrix.os }}-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error
          retention-days: 14

  update-release-version:
    runs-on: ubuntu-latest
    needs: [resolve, delivery, installed-upgrade]
    if: >-
      always() && !cancelled() && !inputs.testOnly && !inputs.verifyPublishedOnly &&
      needs.delivery.result == 'success' &&
      (needs.installed-upgrade.result == 'success' ||
      (needs.resolve.outputs.source == '' && needs.installed-upgrade.result == 'skipped'))

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BUILDER_GITHUB_TOKEN }}

      - name: Get version from workflow input
        id: get_version
        uses: actions/github-script@v7
        with:
          script: |
            let version = '${{ needs.resolve.outputs.tag }}';

            // If no version was specified, get the latest release
            if (!version) {
              const release = await github.rest.repos.getLatestRelease({
                owner: '${{ github.event.inputs.repoOwner }}',
                repo: '${{ github.event.inputs.repoName }}'
              });
              version = release.data.tag_name;
            }

            core.setOutput('version', version);
            console.log(`Version to update: ${version}`);

      - name: Update release.yml with new version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "Updating release.yml with version: $VERSION"

          # Update run-name default version (line 2)
          sed -i "s/github.event.inputs.version || '[^']*'/github.event.inputs.version || '$VERSION'/" .github/workflows/release.yml

          # Update version input default (line 15)
          sed -i "/description: \"Release version/,/default:/ s/default: \"[^\"]*\"/default: \"$VERSION\"/" .github/workflows/release.yml

          # Update scheduled build VERSION (line 103)
          sed -i "s/VERSION=\"[0-9][0-9.]*\"/VERSION=\"$VERSION\"/" .github/workflows/release.yml

          echo "Updated release.yml"
          echo "Showing changes:"
          git diff .github/workflows/release.yml

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update version to ${{ steps.get_version.outputs.version }}"
            for i in 1 2 3 4 5; do
              if git push; then
                echo "✅ Push succeeded on attempt $i"
                exit 0
              fi
              echo "⚠️ Push failed on attempt $i, rebasing on latest main and retrying..."
              git pull --rebase origin main
              sleep $((i * 3))
            done
            echo "❌ Push failed after 5 attempts"
            exit 1
          fi
