name: Build AppFlowy Linux
run-name: Build ${{ github.event.inputs.branch }}/${{ github.event.inputs.build_name }} - ${{ github.event.inputs.internal_build }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo"
        required: true
        default: "AppFlowy-IO/AppFlowy-Premium"
      branch:
        description: "Branch"
        required: true
        default: "main"
      build_name:
        description: "Build Version (it should match the version in pubspec.yaml)"
        required: true
        default: "0.14.3"
      internal_build:
        type: choice
        description: "Internal Build Type (1 for internal, 0 for external)"
        required: true
        default: "1"
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      repo:
        description: "Repo"
        required: true
        type: string
      branch:
        description: "Branch"
        required: true
        type: string
      build_name:
        description: "Build Version"
        required: true
        type: string
      internal_build:
        description: "Internal Build Type"
        required: true
        type: string
      upload_url:
        description: "Upload URL for release assets"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.41.9"
  RUST_TOOLCHAIN: "1.92.0"

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04]
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      BUILD_VERSION: ${{ inputs.build_name }}
      LINUX_APP_RELEASE_PATH: frontend/appflowy_flutter/product/${{ inputs.build_name }}/linux/Release
      LINUX_ZIP_NAME: AppFlowy-${{ inputs.build_name }}-linux.tar.gz
      LINUX_PACKAGE_DEB_NAME: AppFlowy-${{ inputs.build_name }}-linux-x86_64.deb
      LINUX_PACKAGE_RPM_NAME: AppFlowy-${{ inputs.build_name }}-linux-x86_64.rpm
      LINUX_PACKAGE_TMP_RPM_NAME: AppFlowy-${{ inputs.build_name }}-2.x86_64.rpm
      LINUX_PACKAGE_APPIMAGE_NAME: AppFlowy-${{ inputs.build_name }}-linux-x86_64.AppImage

    steps:
      # the following step is required to avoid running out of space
      - name: Maximize build space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout source code
        uses: actions/checkout@v2
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Checkout packaging tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .builder

      - name: Install Rust toolchain
        id: rust_toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.target }}
          override: true
          profile: minimal

      - name: Install flutter
        id: flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.os }}
          workspaces: |
            frontend/rust-lib

      - uses: davidB/rust-cargo-make@v1
        with:
          version: "0.37.18"

      - name: Install prerequisites
        working-directory: frontend
        run: |
          sudo wget -qO /etc/apt/trusted.gpg.d/dart_linux_signing_key.asc https://dl-ssl.google.com/linux/linux_signing_key.pub
          sudo apt-get update
          sudo apt-get install -y --fix-broken
          sudo apt-get install -y build-essential libsqlite3-dev libssl-dev clang cmake ninja-build pkg-config libgtk-3-dev libcurl4-openssl-dev libepoxy-dev
          sudo apt-get install keybinder-3.0 libnotify-dev libwayland-cursor0 libwayland-client0 libwayland-egl1 unzip
          sudo apt-get -y install alien
          sudo apt install libmpv-dev mpv
          sudo apt install libasound2-dev
          # Install GStreamer for audioplayers_linux
          # Install libunwind-dev first to resolve dependency issues
          sudo apt-get -y install libunwind-dev
          sudo apt-get -y install libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          # Install FUSE for AppImage support
          sudo apt-get install -y fuse libfuse2
          # Dependency calculation and direct AppImage packaging tools.
          sudo apt-get install -y dpkg-dev patchelf file desktop-file-utils libgtk-3-bin squashfs-tools zsync gnupg fakeroot strace
          source $HOME/.cargo/env
          cargo install duckscript_cli --force --locked
          rustup target add ${{ matrix.target }}
        shell: bash

      - name: Generate env file
        working-directory: frontend/appflowy_flutter
        run: |
          echo "INTERNAL_BUILD=${{ github.env.inputs.internal_build }}" >> .env
        shell: bash

      - name: Configure Git credentials for Cargo
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.ADMIN_GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials

      - name: Build AppFlowy
        working-directory: frontend
        run: |
          flutter config --enable-linux-desktop
          cd appflowy_flutter
          flutter pub get
          dart run pdfrx:remove_wasm_modules
          trap 'cd "$GITHUB_WORKSPACE/frontend/appflowy_flutter" && dart run pdfrx:remove_wasm_modules --revert' EXIT
          cd ..
          dart ./scripts/flutter_release_build/build_flowy.dart run . ${{ inputs.build_name }}

      - name: Validate Linux bundle
        working-directory: frontend
        run: |
          python3 "$GITHUB_WORKSPACE/.builder/.github/scripts/linux_package.py" audit \
            "appflowy_flutter/product/$BUILD_VERSION/linux/Release/AppFlowy"

      - name: Archive Asset
        working-directory: ${{ env.LINUX_APP_RELEASE_PATH }}
        run: tar -czf "${{ env.LINUX_ZIP_NAME }}" AppFlowy

      - name: Compute .deb runtime dependencies
        working-directory: frontend
        run: |
          python3 "$GITHUB_WORKSPACE/.builder/.github/scripts/linux_package.py" depends \
            "appflowy_flutter/product/$BUILD_VERSION/linux/Release/AppFlowy" \
            --control scripts/linux_distribution/deb/DEBIAN/control

      - name: Build Linux package (.deb)
        working-directory: frontend
        run: |
          sh scripts/linux_distribution/deb/build_deb.sh appflowy_flutter/product/${{ inputs.build_name }}/linux/Release ${{ inputs.build_name }} ${{ env.LINUX_PACKAGE_DEB_NAME }}

      - name: Build Linux package (.rpm)
        working-directory: ${{ env.LINUX_APP_RELEASE_PATH }}
        run: |
          sudo alien -r ${{ env.LINUX_PACKAGE_DEB_NAME }}
          cp -r ${{ env.LINUX_PACKAGE_TMP_RPM_NAME }} ${{ env.LINUX_PACKAGE_RPM_NAME }}

      - name: Build Linux package (.AppImage)
        working-directory: frontend
        run: |
          set -euo pipefail
          # Package the audited CMake payload. Resolving mpv again with apt
          # would reintroduce build-host libraries into a second library tree.
          bash scripts/linux_distribution/appimage/build_appimage.sh \
            "$BUILD_VERSION" \
            "appflowy_flutter/product/$BUILD_VERSION/linux/Release/AppFlowy"
          python3 "$GITHUB_WORKSPACE/.builder/.github/scripts/linux_package.py" audit AppDir
          test -s "AppFlowy-$BUILD_VERSION-x86_64.AppImage"

      - name: Upload packaging test tools
        uses: actions/upload-artifact@v4
        with:
          name: linux-packaging-test-tools
          path: .builder/.github/scripts/linux_*.py
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LINUX_ZIP_NAME }}
          path: ${{ env.LINUX_APP_RELEASE_PATH }}/${{ env.LINUX_ZIP_NAME }}

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LINUX_PACKAGE_APPIMAGE_NAME}}
          path: frontend/AppFlowy-${{ inputs.build_name }}-x86_64.AppImage

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LINUX_PACKAGE_RPM_NAME }}
          path: ${{ env.LINUX_APP_RELEASE_PATH }}/${{ env.LINUX_PACKAGE_RPM_NAME }}

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LINUX_PACKAGE_DEB_NAME }}
          path: ${{ env.LINUX_APP_RELEASE_PATH }}/${{ env.LINUX_PACKAGE_DEB_NAME }}

  # Start the final archives in a clean, newer userspace with host Mesa/GTK
  # and no mpv/FFmpeg packages. Pixel and process checks reject blank windows,
  # missing loaders, and the EGL abort previously accepted by the smoke jobs.
  archive-smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        format: [tarball, appimage]
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: ${{ inputs.build_name }}
      PACKAGE_FORMAT: ${{ matrix.format }}
    steps:
      - name: Install desktop runtime and test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates python3 python3-gi gir1.2-gtk-3.0 binutils \
            xvfb xauth xdotool libgtk-3-0 libegl1 libegl-mesa0 libgl1-mesa-dri \
            libgles2 libkeybinder-3.0-0 libnotify4 \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Download packaging test tools
        uses: actions/download-artifact@v4
        with:
          name: linux-packaging-test-tools
          path: tools

      - name: Download tarball
        if: matrix.format == 'tarball'
        uses: actions/download-artifact@v4
        with:
          name: AppFlowy-${{ inputs.build_name }}-linux.tar.gz
          path: artifact

      - name: Download AppImage
        if: matrix.format == 'appimage'
        uses: actions/download-artifact@v4
        with:
          name: AppFlowy-${{ inputs.build_name }}-linux-x86_64.AppImage
          path: artifact

      - name: Audit and launch the final archive
        run: |
          set -euo pipefail
          mkdir evidence unpacked
          if [ "$PACKAGE_FORMAT" = tarball ]; then
            tar -xzf "artifact/AppFlowy-$BUILD_VERSION-linux.tar.gz" -C unpacked
            python3 tools/linux_package.py audit unpacked/AppFlowy
            executable="$PWD/unpacked/AppFlowy/AppFlowy"
          else
            executable="$PWD/artifact/AppFlowy-$BUILD_VERSION-x86_64.AppImage"
            test -s "$executable"
            chmod +x "$executable"
            (cd unpacked && "$executable" --appimage-extract > ../evidence/extract.log)
            python3 tools/linux_package.py audit unpacked/squashfs-root
            export APPIMAGE_EXTRACT_AND_RUN=1
          fi
          # No installed mpv can accidentally hide an incomplete media bundle.
          if dpkg-query -W -f='${db:Status-Status}' libmpv1 2>/dev/null | grep -q installed; then
            echo "::error::Runtime image unexpectedly contains libmpv1"
            exit 1
          fi
          xvfb-run -a python3 tools/linux_smoke.py \
            --log evidence/smoke.log "$executable"

      - name: Preserve smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.format }}-smoke-evidence
          path: evidence/
          if-no-files-found: warn

  # Exercise the installation path from #9010, rather than only inspecting
  # Depends or extracting the .deb. Each job begins with standard Ubuntu repos.
  deb-install-test:
    needs: build
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04", "26.04"]
    defaults:
      run:
        shell: bash
    env:
      BUILD_VERSION: ${{ inputs.build_name }}
    steps:
      - name: Install test tools and a headless Mesa display
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates python3 python3-gi gir1.2-gtk-3.0 binutils \
            xvfb xauth xdotool libegl1 libegl-mesa0 libgl1-mesa-dri \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - name: Download packaging test tools
        uses: actions/download-artifact@v4
        with:
          name: linux-packaging-test-tools
          path: tools

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: AppFlowy-${{ inputs.build_name }}-linux-x86_64.deb
          path: artifact

      - name: Install and launch the final Debian package
        run: |
          set -euo pipefail
          mkdir evidence
          apt-get install -y \
            "$PWD/artifact/AppFlowy-$BUILD_VERSION-linux-x86_64.deb" \
            2>&1 | tee evidence/install.log
          test "$(dpkg-query -W -f='${db:Status-Status}' appflowy)" = installed
          python3 tools/linux_package.py audit /usr/lib/AppFlowy
          xvfb-run -a python3 tools/linux_smoke.py \
            --log evidence/smoke.log /usr/bin/AppFlowy

      - name: Preserve install and smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-ubuntu-${{ matrix.ubuntu }}-evidence
          path: evidence/
          if-no-files-found: warn

  publish-linux:
    needs: [build, archive-smoke-test, deb-install-test]
    if: inputs.upload_url != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      BUILD_VERSION: ${{ inputs.build_name }}
      RELEASE_UPLOAD_URL: ${{ inputs.upload_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          pattern: AppFlowy-${{ inputs.build_name }}-linux*
          path: artifacts
          merge-multiple: true

      - name: Upload validated Linux packages to release
        run: |
          set -euo pipefail
          upload_url="${RELEASE_UPLOAD_URL%%\{*}"
          for suffix in linux.tar.gz linux-x86_64.deb linux-x86_64.rpm linux-x86_64.AppImage; do
            filename="AppFlowy-$BUILD_VERSION-$suffix"
            filepath="artifacts/$filename"
            # Preserve the public AppImage name while accepting its build name.
            if [[ "$suffix" = linux-x86_64.AppImage ]]; then
              filepath="artifacts/AppFlowy-$BUILD_VERSION-x86_64.AppImage"
            fi
            test -s "$filepath"
            encoded_filename=$(jq -nr --arg filename "$filename" '$filename | @uri')
            curl --fail-with-body --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$filepath" \
              "$upload_url?name=$encoded_filename"
          done
