name: Test update validation

on:
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/auto_update.yaml'
      - '.github/workflows/macos.yaml'
      - '.github/workflows/windows.yaml'
      - '.github/workflows/test-update-validation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/auto_update.yaml'
      - '.github/workflows/macos.yaml'
      - '.github/workflows/windows.yaml'
      - '.github/workflows/test-update-validation.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r scripts/requirements-update-validation.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
