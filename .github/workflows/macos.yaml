name: Build AppFlowy macOS
run-name: Build ${{ github.event.inputs.branch }}/${{ github.event.inputs.build_name }} - ${{ github.event.inputs.internal_build }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo"
        required: true
        default: "AppFlowy-IO/AppFlowy-Premium"
      branch:
        description: "Branch"
        required: true
        default: "main"
      build_name:
        description: "Build Version (it should match the version in pubspec.yaml)"
        required: true
        default: "0.14.7"
      internal_build:
        type: choice
        description: "Internal Build Type (1 for internal, 0 for external)"
        required: true
        default: "1"
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      repo:
        description: "Repo"
        required: true
        type: string
      branch:
        description: "Branch"
        required: true
        type: string
      build_name:
        description: "Build Version"
        required: true
        type: string
      internal_build:
        description: "Internal Build Type"
        required: true
        type: string
      upload_url:
        description: "Upload URL for release assets"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  arm64:
    runs-on: macos-latest

    env:
      MACOS_APP_RELEASE_PATH: frontend/appflowy_flutter/product/${{ inputs.build_name }}/macos/Release
      MACOS_ZIP_NAME: AppFlowy-${{ inputs.build_name }}-macos-arm64.zip
      MACOS_DMG_NAME: AppFlowy-${{ inputs.build_name }}-macos-arm64
      MACOS_ENTITLEMENTS_PATH: frontend/appflowy_flutter/macos/Runner/Release.entitlements

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-arm64
          cache-all-crates: true
          cache-on-failure: true
          workspaces: |
            frontend/rust-lib

      - name: Install build tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@0.37.18, duckscript_cli

      - name: Install prerequisites
        working-directory: frontend
        run: cargo make appflowy-flutter-deps-tools

      - name: Generate env file
        working-directory: frontend/appflowy_flutter
        run: |
          echo "INTERNAL_BUILD=${{ inputs.internal_build }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Configure Git credentials for Cargo
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.ADMIN_GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials

      - name: Build AppFlowy (ARM64)
        working-directory: frontend
        env:
          ARCHS: arm64
        run: |
          echo "🔧 Building AppFlowy for ARM64 only"
          echo "Runner architecture: $(uname -m)"
          echo "Rust target: aarch64-apple-darwin"

          flutter config --enable-macos-desktop
          cargo make --profile production-mac-arm64 --env APP_VERSION=${{ inputs.build_name }} appflowy

          test -d "appflowy_flutter/product/${{ inputs.build_name }}/macos/Release/AppFlowy.app"
          file "appflowy_flutter/product/${{ inputs.build_name }}/macos/Release/AppFlowy.app/Contents/MacOS/AppFlowy"

      - name: Codesign AppFlowy
        run: |
          if [ -z "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" ]; then
            echo "⚠️ Skipping code signing - MACOS_CERTIFICATE_BASE64 not set"
            exit 0
          fi

          echo "✍️ Code signing AppFlowy app..."
          echo ${{ secrets.MACOS_CERTIFICATE_BASE64 }} | base64 --decode > certificate.p12
          security create-keychain -p action build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p action build.keychain
          security import certificate.p12 -k build.keychain -P ${{ secrets.P12_PASSWORD }} -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k action build.keychain

          if [ ! -d "${{ env.MACOS_APP_RELEASE_PATH }}/AppFlowy.app" ]; then
            echo "❌ AppFlowy.app not found at ${{ env.MACOS_APP_RELEASE_PATH }}/AppFlowy.app"
            exit 1
          fi

          /usr/bin/codesign \
            --force \
            --options runtime \
            --timestamp \
            --deep \
            --entitlements "${{ env.MACOS_ENTITLEMENTS_PATH }}" \
            --sign "${{ secrets.MACOS_CODESIGN_ID }}" \
            "${{ env.MACOS_APP_RELEASE_PATH }}/AppFlowy.app" \
            -v
          echo "✅ Code signing completed"

      - name: Create macOS DMG
        run: |
          brew install create-dmg
          i=0
          until [[ -e "${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_DMG_NAME }}.dmg" ]]; do
            create-dmg \
              --volname "${{ env.MACOS_DMG_NAME }}" \
              --hide-extension "AppFlowy.app" \
              --background frontend/scripts/dmg_assets/AppFlowyInstallerBackground.jpg \
              --window-size 600 450 \
              --icon-size 94 \
              --icon "AppFlowy.app" 141 249 \
              --app-drop-link 458 249 \
              "${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_DMG_NAME }}.dmg" \
              "${{ env.MACOS_APP_RELEASE_PATH }}/AppFlowy.app" || true
            if [[ $i -eq 10 ]]; then
              echo "❌ create-dmg did not succeed after 10 attempts"
              exit 1
            fi
            i=$((i + 1))
          done
          echo "✅ ARM64 DMG created"

      - name: Check notarization secrets
        id: secret-check
        shell: bash
        run: |
          if [ -n "${{ secrets.MACOS_NOTARY_USER }}" ] && \
             [ -n "${{ secrets.MACOS_TEAM_ID }}" ] && \
             [ -n "${{ secrets.MACOS_NOTARY_PWD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notarize ARM64 DMG
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        run: |
          MAX_RETRIES=3
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "📝 Notarization attempt $attempt/$MAX_RETRIES..."
            if xcrun notarytool submit \
              "${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_DMG_NAME }}.dmg" \
              --apple-id "${{ secrets.MACOS_NOTARY_USER }}" \
              --team-id "${{ secrets.MACOS_TEAM_ID }}" \
              --password "${{ secrets.MACOS_NOTARY_PWD }}" \
              --output-format json \
              --wait; then
              xcrun stapler staple "${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_DMG_NAME }}.dmg"
              echo "✅ Notarization and stapling completed"
              break
            fi

            if [[ "$attempt" -eq "$MAX_RETRIES" ]]; then
              echo "❌ Notarization failed after $MAX_RETRIES attempts"
              exit 1
            fi
            sleep 10
          done

      - name: Verify ARM64 DMG
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        run: xcrun stapler validate "${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_DMG_NAME }}.dmg"

      - name: Archive ARM64 app
        working-directory: ${{ env.MACOS_APP_RELEASE_PATH }}
        run: zip --symlinks -qr "${{ env.MACOS_ZIP_NAME }}" AppFlowy.app

      - name: Upload ARM64 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ZIP_NAME }}
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_ZIP_NAME }}

      - name: Upload ARM64 DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_DMG_NAME }}.dmg
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_DMG_NAME }}.dmg

      - name: Upload ARM64 assets to Release
        if: inputs.upload_url != ''
        working-directory: ${{ env.MACOS_APP_RELEASE_PATH }}
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upload_url=$(printf '%s' "$UPLOAD_URL" | sed 's/{[^}]*}//g')
          for filename in \
            "${{ env.MACOS_ZIP_NAME }}" \
            "${{ env.MACOS_DMG_NAME }}.dmg"; do
            encoded_filename=$(printf '%s' "$filename" | jq -sRr @uri)
            echo "Uploading $filename to release..."
            curl -L -X POST \
              -H "Accept: application/vnd.github.v3+json" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$filename" \
              "${upload_url}?name=${encoded_filename}" \
              --fail-with-body
          done
