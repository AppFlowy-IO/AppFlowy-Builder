name: Build AppFlowy macOS
run-name: Build ${{ github.event.inputs.branch }}/${{ github.event.inputs.build_name }} - ${{ github.event.inputs.internal_build }}

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo"
        required: true
        default: "AppFlowy-IO/AppFlowy-Premium"
      branch:
        description: "Branch"
        required: true
        default: "main"
      build_name:
        description: "Build Version (it should match the version in pubspec.yaml)"
        required: true
        default: "0.14.10"
      internal_build:
        type: choice
        description: "Internal Build Type (1 for internal, 0 for external)"
        required: true
        default: "1"
        options:
          - "0"
          - "1"
  workflow_call:
    inputs:
      repo:
        description: "Repo"
        required: true
        type: string
      branch:
        description: "Branch"
        required: true
        type: string
      build_name:
        description: "Build Version"
        required: true
        type: string
      internal_build:
        description: "Internal Build Type"
        required: true
        type: string
      upload_url:
        description: "Upload URL for release assets"
        required: false
        type: string

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  universal:
    runs-on: macos-latest

    env:
      BUILD_VERSION: ${{ inputs.build_name }}
      MACOS_APP_RELEASE_PATH: frontend/appflowy_flutter/product/${{ inputs.build_name }}/macos/Release
      MACOS_ASSET_PREFIX: AppFlowy-${{ inputs.build_name }}-macos
      MACOS_ENTITLEMENTS_PATH: frontend/appflowy_flutter/macos/Runner/Release.entitlements

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Checkout packaging tools
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: .builder

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate desktop update manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          generator=frontend/scripts/tool/generate_desktop_update_manifest.py
          if [ ! -f "$generator" ]; then
            echo "::error::Desktop source does not contain $generator. Build a revision with desktop update manifest support."
            exit 1
          fi
          python "$generator" --version "$RELEASE_VERSION" --output desktop-update.json

      - name: Upload desktop update manifest
        if: inputs.upload_url == ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update.json
          path: desktop-update.json
          if-no-files-found: error

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: macos-universal
          cache-all-crates: true
          cache-on-failure: true
          workspaces: |
            frontend/rust-lib

      - name: Install build tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-make@0.37.18, duckscript_cli

      - name: Install prerequisites
        working-directory: frontend
        run: cargo make appflowy-flutter-deps-tools

      - name: Generate env file
        working-directory: frontend/appflowy_flutter
        run: |
          echo "INTERNAL_BUILD=${{ inputs.internal_build }}" >> .env
          echo "SENTRY_DSN=${{ secrets.SENTRY_DSN }}" >> .env

      - name: Configure Git credentials for Cargo
        run: |
          git config --global credential.helper store
          echo "https://${{ secrets.ADMIN_GITHUB_TOKEN }}:x-oauth-basic@github.com" > ~/.git-credentials

      - name: Build AppFlowy (Universal)
        working-directory: frontend
        run: |
          echo "🔧 Building AppFlowy for ARM64 and x86_64"
          echo "Runner architecture: $(uname -m)"
          rustup target list --installed

          flutter config --enable-macos-desktop
          bash -e -o pipefail scripts/flutter_release_build/build_universal_package_for_macos.sh "$BUILD_VERSION"

      - name: Verify universal app
        run: |
          app="$MACOS_APP_RELEASE_PATH/AppFlowy.app"
          test -d "$app"
          # Apple lipo consumes all trailing arguments as architecture names.
          # Check one slice per invocation for compatibility with LLVM lipo too.
          for arch in arm64 x86_64; do
            xcrun lipo "$app/Contents/MacOS/AppFlowy" -verify_arch "$arch"
          done

      - name: Prepare architecture-specific apps
        run: |
          set -euo pipefail
          mkdir -p "$MACOS_APP_RELEASE_PATH/universal"
          mv "$MACOS_APP_RELEASE_PATH/AppFlowy.app" "$MACOS_APP_RELEASE_PATH/universal/AppFlowy.app"
          for arch in arm64 x86_64; do
            mkdir -p "$MACOS_APP_RELEASE_PATH/$arch"
            bash .builder/.github/scripts/thin_app.sh \
              "$MACOS_APP_RELEASE_PATH/universal/AppFlowy.app" \
              "$arch" "$MACOS_APP_RELEASE_PATH/$arch/AppFlowy.app"
          done

      - name: Codesign AppFlowy
        run: |
          if [ -z "${{ secrets.MACOS_CERTIFICATE_BASE64 }}" ]; then
            echo "⚠️ Skipping code signing - MACOS_CERTIFICATE_BASE64 not set"
            exit 0
          fi

          echo "✍️ Code signing AppFlowy app..."
          echo ${{ secrets.MACOS_CERTIFICATE_BASE64 }} | base64 --decode > certificate.p12
          security create-keychain -p action build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p action build.keychain
          security import certificate.p12 -k build.keychain -P ${{ secrets.P12_PASSWORD }} -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k action build.keychain

          for arch in universal arm64 x86_64; do
            app="$MACOS_APP_RELEASE_PATH/$arch/AppFlowy.app"
            test -d "$app"
            /usr/bin/codesign \
              --force \
              --options runtime \
              --timestamp \
              --deep \
              --entitlements "$MACOS_ENTITLEMENTS_PATH" \
              --sign "${{ secrets.MACOS_CODESIGN_ID }}" \
              "$app" \
              -v
            /usr/bin/codesign --verify --strict --deep -v "$app"
          done
          echo "✅ Code signing completed"

      - name: Create macOS DMGs
        run: |
          brew install create-dmg
          for arch in universal arm64 x86_64; do
            dmg="$MACOS_APP_RELEASE_PATH/$MACOS_ASSET_PREFIX-$arch.dmg"
            for attempt in $(seq 1 10); do
              # A failed attempt can leave an incomplete image behind.
              rm -f "$dmg"
              if create-dmg \
                --volname "$MACOS_ASSET_PREFIX-$arch" \
                --hide-extension "AppFlowy.app" \
                --background frontend/scripts/dmg_assets/AppFlowyInstallerBackground.jpg \
                --window-size 600 450 \
                --icon-size 94 \
                --icon "AppFlowy.app" 141 249 \
                --app-drop-link 458 249 \
                "$dmg" \
                "$MACOS_APP_RELEASE_PATH/$arch/AppFlowy.app"; then
                test -s "$dmg"
                break
              fi
              if [[ "$attempt" -eq 10 ]]; then
                echo "❌ create-dmg failed for $arch after 10 attempts"
                exit 1
              fi
            done
          done
          echo "✅ Universal, ARM64, and x86_64 DMGs created"

      - name: Check notarization secrets
        id: secret-check
        shell: bash
        run: |
          if [ -n "${{ secrets.MACOS_NOTARY_USER }}" ] && \
             [ -n "${{ secrets.MACOS_TEAM_ID }}" ] && \
             [ -n "${{ secrets.MACOS_NOTARY_PWD }}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Notarize macOS DMGs
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        run: |
          MAX_RETRIES=3
          for arch in universal arm64 x86_64; do
            dmg="$MACOS_APP_RELEASE_PATH/$MACOS_ASSET_PREFIX-$arch.dmg"
            for attempt in $(seq 1 "$MAX_RETRIES"); do
              echo "📝 $arch notarization attempt $attempt/$MAX_RETRIES..."
              if xcrun notarytool submit \
                "$dmg" \
                --apple-id "${{ secrets.MACOS_NOTARY_USER }}" \
                --team-id "${{ secrets.MACOS_TEAM_ID }}" \
                --password "${{ secrets.MACOS_NOTARY_PWD }}" \
                --output-format json \
                --wait; then
                xcrun stapler staple "$dmg"
                echo "✅ $arch notarization and stapling completed"
                break
              fi

              if [[ "$attempt" -eq "$MAX_RETRIES" ]]; then
                echo "❌ $arch notarization failed after $MAX_RETRIES attempts"
                exit 1
              fi
              sleep 10
            done
          done

      - name: Verify macOS DMGs
        if: ${{ steps.secret-check.outputs.available == 'true' }}
        run: |
          for arch in universal arm64 x86_64; do
            xcrun stapler validate "$MACOS_APP_RELEASE_PATH/$MACOS_ASSET_PREFIX-$arch.dmg"
          done

      - name: Archive macOS apps
        working-directory: ${{ env.MACOS_APP_RELEASE_PATH }}
        run: |
          for arch in universal arm64 x86_64; do
            (cd "$arch" && zip --symlinks -qr "../$MACOS_ASSET_PREFIX-$arch.zip" AppFlowy.app)
          done

      - name: Upload Universal ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ASSET_PREFIX }}-universal.zip
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_ASSET_PREFIX }}-universal.zip
          if-no-files-found: error

      - name: Upload Universal DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ASSET_PREFIX }}-universal.dmg
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_ASSET_PREFIX }}-universal.dmg
          if-no-files-found: error

      - name: Upload ARM64 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ASSET_PREFIX }}-arm64.zip
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_ASSET_PREFIX }}-arm64.zip
          if-no-files-found: error

      - name: Upload ARM64 DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ASSET_PREFIX }}-arm64.dmg
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_ASSET_PREFIX }}-arm64.dmg
          if-no-files-found: error

      - name: Upload x86_64 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ASSET_PREFIX }}-x86_64.zip
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_ASSET_PREFIX }}-x86_64.zip
          if-no-files-found: error

      - name: Upload x86_64 DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ASSET_PREFIX }}-x86_64.dmg
          path: ${{ env.MACOS_APP_RELEASE_PATH }}/${{ env.MACOS_ASSET_PREFIX }}-x86_64.dmg
          if-no-files-found: error

      - name: Upload macOS assets to Release
        if: inputs.upload_url != ''
        working-directory: ${{ env.MACOS_APP_RELEASE_PATH }}
        env:
          UPLOAD_URL: ${{ inputs.upload_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          upload_url=$(printf '%s' "$UPLOAD_URL" | sed 's/{[^}]*}//g')
          for arch in universal arm64 x86_64; do
            for extension in zip dmg; do
              filename="$MACOS_ASSET_PREFIX-$arch.$extension"
              encoded_filename=$(printf '%s' "$filename" | jq -sRr @uri)
              echo "Uploading $filename to release..."
              curl -L -X POST \
                -H "Accept: application/vnd.github.v3+json" \
                -H "Authorization: token $GITHUB_TOKEN" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@$filename" \
                "${upload_url}?name=${encoded_filename}" \
                --fail-with-body
            done
          done
