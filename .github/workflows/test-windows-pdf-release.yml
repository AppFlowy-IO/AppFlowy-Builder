name: Test Windows PDF release gate

on:
  pull_request:
    paths:
      - 'scripts/verify_windows_pdf.py'
      - 'scripts/test_verify_windows_pdf.py'
      - 'scripts/windows_pdf_release_test.py'
      - '.github/workflows/windows.yaml'
      - '.github/workflows/test-windows-pdf-release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/verify_windows_pdf.py'
      - 'scripts/test_verify_windows_pdf.py'
      - 'scripts/windows_pdf_release_test.py'
      - '.github/workflows/windows.yaml'
      - '.github/workflows/test-windows-pdf-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Exercise PDF rendering from actual ZIP and installer payloads
        run: >-
          python scripts/windows_pdf_release_test.py
          --output "${{ runner.temp }}/windows-pdf-gate-test"
      - name: Preserve PDF release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-pdf-gate-test
          path: |
            ${{ runner.temp }}/windows-pdf-gate-test/*.log
            ${{ runner.temp }}/windows-pdf-gate-test/*.json
            ${{ runner.temp }}/windows-pdf-gate-test/*/*.json
            ${{ runner.temp }}/windows-pdf-gate-test/*/*.png
            ${{ runner.temp }}/windows-pdf-gate-test/*/*.log
          if-no-files-found: warn
          retention-days: 14
